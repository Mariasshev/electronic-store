plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.store'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- Spring Boot Starters ---

    // Включає: Tomcat (сервер), Spring MVC, Jackson (JSON), REST, Logging
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Включає: Hibernate, JPA, JDBC (для роботи з базою даних)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // --- Database Drivers ---

    // Ваша бібліотека для Oracle (локальний файл)
    implementation files('lib/ojdbc11-21.9.0.0.jar')

    // Якщо захочете перейти на PostgreSQL (рекомендовано), розкоментуйте цей рядок:
    // runtimeOnly 'org.postgresql:postgresql'

    // --- Utilities ---

    // Lombok: генерує Getters/Setters/Constructors автоматично (через @Data)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // BCrypt: залишаємо для сумісності з вашою логікою хешування паролів
    // (хоча в майбутньому краще перейти на Spring Security)
    implementation 'org.mindrot:jbcrypt:0.4'

    // OkHttp: залишив, якщо ви використовуєте його для зовнішніх запитів
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'

    // --- Testing ---

    // Включає: JUnit 5, Mockito, AssertJ, Hamcrest (все в одному)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}